<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pixel Parlor</title>
  <meta name="description" content="Pixel Parlor is a small online arcade with six games, high scores and a player profile.">
  <meta name="theme-color" content="#e8ebf3">
  <script>
    /* Apply the saved theme before first paint so there is no flash. */
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('arcade.v1') || '{}');
        var theme = saved.settings && saved.settings.theme;
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      } catch (e) { /* storage unavailable: keep the default */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Pixel Parlor home">
        <svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">
          <path fill="currentColor" d="M2 0h4v1h1v1h1v4H7v1H6v1H2V7H1V6H0V2h1V1h1z"/>
          <path style="fill: var(--coin)" d="M2 1h4v1h1v4H6v1H2V6H1V2h1z"/>
          <rect x="3" y="2" width="2" height="4" fill="currentColor"/>
        </svg>
        <span>Pixel Parlor</span>
      </a>
    </header>

    <nav class="nav" aria-label="Primary">
      <a href="#/" data-route="home">Home</a>
      <a href="#/library" data-route="library">Library</a>
      <a href="#/library?fav=1" data-route="favorites">Favorites</a>
      <a href="#/profile" data-route="profile">Profile</a>
    </nav>

    <main id="view" tabindex="-1">
      <h1>Pixel Parlor</h1>
      <p>The arcade is warming up.</p>
    </main>
  </div>

  <script src="js/core/utils.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/games/catalog.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
